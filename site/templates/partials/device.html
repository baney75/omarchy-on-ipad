<article class="device" id="device-{{ANCHOR}}" aria-labelledby="device-{{ANCHOR}}-title">
  <div class="device__head">
    <h3 class="device__name" id="device-{{ANCHOR}}-title">{{FAMILY}}</h3>
    <span class="device__role">{{ROLE_LABEL}}</span>
  </div>
  <dl class="device__facts">
    {{{DEVICE_FACTS}}}
  </dl>
  {{{DEVICE_STATUS}}}
</article>
